plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.qids'
version = '1.3.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'QIDS Java SDK'
                description = 'Java client for Quantum Digital Signatures through a QIDS gateway'
                url = 'https://github.com/Raunakg2005/qids-java'
            }
        }
    }
}
