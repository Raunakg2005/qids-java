plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.qids'
version = '1.3.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'QIDS Java SDK'
                description = 'Enterprise Java client library for Quantum Intrusion Detection System (QIDS)'
                url = 'https://github.com/Raunakg2005/qids-java'
            }
        }
    }
}
